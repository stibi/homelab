---
# Variables shared by every workstation-class host.

# --- base role ---------------------------------------------------------

base_packages:
  - ca-certificates
  - curl
  - git
  - htop
  - jq
  - tmux
  - tree
  - unzip
  - wget
  # Native compiler/linker and pkg-config metadata are needed by Rust crates
  # which build C dependencies. The Rust toolchain itself is managed by asdf
  # below so projects are not held to Debian's older rustc/cargo packages.
  - build-essential
  - pkg-config
  - libssl-dev
  # Keep these on Debian's security-supported package track; neither needs a
  # separately pinned upstream binary for workstation use.
  - ansible-lint
  - shellcheck
  # Debian splits venv out of the stdlib, so python3 alone cannot create one
  # (no ensurepip). pre-commit builds a virtualenv for every language:python
  # hook — ruff, black, yamllint, detect-secrets — so without this, pre-commit
  # installs fine and then fails the moment it runs a real hook.
  - python3-venv
  # Feeds a password to ssh non-interactively. ssh deliberately refuses to read
  # one from stdin or the environment — it opens /dev/tty directly — so sshpass
  # runs ssh inside a pseudo-terminal and answers the prompt for it.
  #
  # NOTE: ansible-core 2.19 no longer needs this. Its ssh connection plugin
  # gained `password_mechanism`, defaulting to `ssh_askpass`, which uses
  # Ansible's own bundled helper. sshpass is only used when that is explicitly
  # set to `sshpass`. Kept because it is still what most third-party scripts and
  # older runbooks reach for.
  - sshpass
  # Unprivileged sandboxing: runs a process in its own mount/pid/user
  # namespaces with a filesystem view you define. Claude Code's Linux sandbox
  # uses it (settings expose sandbox.bwrapPath), and codex ships its own copy
  # under codex-resources/ rather than relying on the system one.
  #
  # Needs unprivileged user namespaces, which work on this kernel — verified
  # with `unshare --user --map-root-user true` — so the non-setuid Debian
  # package is enough.
  - bubblewrap

# NOTE: neovim is deliberately NOT installed from apt on zase-prace.
# A newer upstream build already lives in /opt/nvim-linux-x86_64 and is on
# PATH; installing the apt package (0.10.x) would shadow it in /usr/bin.

# --- shell role --------------------------------------------------------

shell_packages:
  # shell itself + prompt
  - zsh
  - zsh-autosuggestions
  - zsh-syntax-highlighting
  - starship
  - stow
  # search & navigation
  - fzf
  - ripgrep
  - fd-find
  - zoxide
  # file / diff viewing
  - eza
  - bat
  - git-delta
  # per-directory environments
  - direnv

# zsh-completions is not packaged in Debian 13; zsh 5.9 ships a large
# completion set in /usr/share/zsh/vendor-completions already.

shell_login_shell: /usr/bin/zsh

dotfiles_repo: git@github.com:stibi/dotfiles.git
dotfiles_dir: "{{ ansible_user_dir }}/dev/moje/dotfiles"

# The stow package holding this host's shell config.
# zsh-linux-zase-prace-vm is machine-specific; nvim is shared with the macOS
# workstation and contains nothing platform-dependent, so it is stowed as-is
# rather than forked.
shell_stow_packages:
  - zsh-linux-zase-prace-vm
  - nvim

# Paths the stow package owns. A pre-existing *regular file* at any of these
# would make stow abort, so the role moves it aside first.
shell_stow_targets:
  - "{{ ansible_user_dir }}/.zshrc"
  - "{{ ansible_user_dir }}/.zshrc.d"
  - "{{ ansible_user_dir }}/.config/starship.toml"
  - "{{ ansible_user_dir }}/.kube/kubie.yaml"
  - "{{ ansible_user_dir }}/.claude/statusline.sh"
  - "{{ ansible_user_dir }}/.config/hunk/config.toml"

# --- kubernetes role ---------------------------------------------------

# Pinned deliberately: "latest" is not reproducible. Both values must be
# bumped together — see "Upgrading kubectl" in the README.
# v1.36.3 was the current stable as of 2026-08-12.
kubectl_version: v1.36.3
kubectl_sha256: ebbd080e7c2e275093b55915722043257eb24004363e20acb3c4d71919f88336

# kubie manages the split kubeconfig setup: one file per cluster in
# ~/.kube/configs/, each `kubie ctx` getting its own isolated subshell.
# Not packaged for Debian, so it comes from the GitHub release.
# Upstream publishes no checksum file; this sha256 was taken from the v0.28.0
# asset on 2026-08-12 and pins it from here on.
kubie_version: v0.28.0
kubie_sha256: 73c33bf140e3a6bf4cb603c371d1189f5bcce85ccc4e48fcfef9cd64642ffead

# --- talos role --------------------------------------------------------

# Sidero Labs CLIs. Unlike kubie, both projects publish a signed sha256sum.txt
# with their releases, so these checksums are upstream's own — not observed
# once and pinned. Versions current as of 2026-08-12.
#
# Both follow <url_base>/<version>/<name>-linux-<arch>.
talos_binaries:
  - name: talosctl
    version: v1.13.8
    url_base: https://github.com/siderolabs/talos/releases/download
    version_args: version --client
    sha256:
      amd64: 406b56f9e4ff03b1557cc941b1f163aec8a6ebb36e28f0bbbe6d083589529261
      arm64: 255ed9ccd2cfa26c619c5d445c013e4b6bf9e7d5a5aecbd72145db01a531ec60

  - name: omnictl
    version: v1.10.0
    url_base: https://github.com/siderolabs/omni/releases/download
    version_args: --version
    sha256:
      amd64: 7a5dc3af00ea77d286909953bb7bfdb9a660fb61bd111620fcd1761d054807e5
      arm64: 4a1ec4b24361ea1051d1c2b9673dbf7987f62d1c82e73c32e7894714b04c8182

# --- asdf role ---------------------------------------------------------

# asdf itself is hand-installed and already manages nodejs and bun; this list
# only covers what Ansible owns, so those two are deliberately left alone.
#
# The asdf-pre-commit plugin downloads pre-commit's official .pyz zipapp from
# its GitHub release. The zipapp's shebang is `#!/usr/bin/env python3`, which
# Debian satisfies — the plugin's docs mention a bare `python`, but that is
# only help text and is not required.
asdf_tools:
  - name: pre-commit
    version: 4.6.2

  # From the asdf-community/asdf-hashicorp plugin, which verifies the release
  # signature with gpg. 1.16.0 satisfies every active required_version in
  # devops/iac — the strictest is `~> 1.15`, and the pessimistic operator lets
  # the rightmost component increment, so it admits 1.16.
  #
  # asdf keeps versions side by side, so this global pin is not binding: drop a
  # .tool-versions in a repo that needs a different one.
  - name: terraform
    version: 1.16.0

  # Required by nvim-treesitter's `main` branch, which shells out to
  # `tree-sitter build` instead of compiling parsers with cc as `master` did.
  # The README requires 0.26.1 or later, so Debian's tree-sitter-cli (0.22.6)
  # is too old. Upstream publishes no checksums for these artifacts, so a
  # pinned get_url would be trust-on-first-use anyway — asdf is no weaker here
  # and this is a build tool, not a credentials one.
  - name: tree-sitter
    version: 0.27.0

  # Pairs with the terraform pin above; devops/iac has 25 terragrunt.hcl units.
  #
  # 19 of those still use bare (unlabeled) `include {}` blocks, deprecated back
  # in v0.81.0. They still work: the runtime rewrites them in memory for
  # backwards compatibility, and `terragrunt render` resolves them correctly on
  # 1.1.4. Only `terragrunt hcl validate` rejects them, because it checks raw
  # HCL against the schema before that rewrite happens — so a validate run over
  # this repo will report errors for configs that execute fine.
  - name: terragrunt
    version: 1.1.4

  # Debian 13 packages Go 1.24; this is 1.27.1, and asdf keeps versions side by
  # side so a project needing another one just drops a .tool-versions.
  #
  # `bin` is set because this is the one plugin whose name differs from the
  # binary it provides — the plugin is "golang", the shim is "go". `version_args`
  # likewise: go has no --version flag, it is `go version`.
  - name: golang
    version: 1.27.1
    bin: go
    version_args: version

  # The code-lever/asdf-rust plugin installs the official Rust distribution.
  # Its default profile includes cargo, rustfmt and clippy alongside rustc.
  # 1.98.1 is the stable release published on 2026-09-03.
  - name: rust
    version: 1.98.1
    bin: rustc

# --- cli_tools role ----------------------------------------------------

# Release tarballs, pinned and checksum-verified. Versions current as of
# 2026-08-13. gh, glab and flux are pinned for both arches (upstream publishes
# both); cue is amd64-only because it ships no checksums file at all, so an
# arm64 pin would have to be computed by hand. The role asserts on a missing
# pin rather than silently building a bad URL.
#
# gh and glab ARE in Debian 13, but far behind: gh 2.46.0 vs 2.97.0 upstream,
# glab 1.53.0 vs 1.113.0. cue and flux are not packaged at all.
#
# version_args differ per tool and were checked against the real binaries:
# cue has no --version flag at all, it is `cue version`.
#
# archive_path is where the binary sits inside the tarball; all four differ.
cli_tools:
  - name: gh
    version: 2.97.0
    url: https://github.com/cli/cli/releases/download/v2.97.0/gh_2.97.0_linux_{{ cli_tools_arch }}.tar.gz
    archive_path: gh_2.97.0_linux_{{ cli_tools_arch }}/bin/gh
    version_args: --version
    sha256:
      amd64: a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112
      arm64: 73ea440ecad9c9e284429997ee6f93577bc6f7bc6fba357ef62c53ad8fb641a5

  - name: glab
    version: 1.113.0
    url: https://gitlab.com/api/v4/projects/gitlab-org%2Fcli/packages/generic/glab/1.113.0/glab_1.113.0_linux_{{ cli_tools_arch }}.tar.gz
    archive_path: bin/glab
    version_args: --version
    sha256:
      amd64: c265589fb2018f310b6a27df9356efee42991f858e7e3a5fa232228a13b47467
      arm64: 0c4cab3b35f7641e7955492b9491d7070698a958f0dfcb49d989e71bd78793c2

  # cue is the one tool here that publishes no checksums file, so this sha256
  # was computed from the v0.17.1 artifact on 2026-08-13 and pins it from now
  # on. Note the tarball name carries a "v" the others do not.
  - name: cue
    version: 0.17.1
    url: https://github.com/cue-lang/cue/releases/download/v0.17.1/cue_v0.17.1_linux_{{ cli_tools_arch }}.tar.gz
    archive_path: cue
    version_args: version
    sha256:
      amd64: a39b0c97695069d95d276d99be0f5dbabb081d801bfdc9ba49b76efaf94e2369

  - name: flux
    version: 2.9.4
    url: https://github.com/fluxcd/flux2/releases/download/v2.9.4/flux_2.9.4_linux_{{ cli_tools_arch }}.tar.gz
    archive_path: flux
    version_args: --version
    sha256:
      amd64: c2c397a52930f52d2005c01d276116b059d062de379386d58e98115380a766a2
      arm64: dcab945f8d8658662fa1db93e150a602ba1f91da367a82e099bd65595fc7c62c

  # Note the capital L in "Linux" — k9s is the only one here that capitalises
  # it, and the lowercase spelling 404s. Its version flag is `version --short`,
  # not `--version`.
  - name: k9s
    version: 0.51.0
    url: https://github.com/derailed/k9s/releases/download/v0.51.0/k9s_Linux_{{ cli_tools_arch }}.tar.gz
    archive_path: k9s
    version_args: version --short
    sha256:
      amd64: c3752ad51a5a4015a113819c4eeb6e55a4d0e4b8e652494797532f6fc8161dd7
      arm64: 3ee05c82e5f9198928a4e86133608ba6a2c10a2244d6a7789e820f78319d640c

# --- codex role --------------------------------------------------------

# The upstream tag is "rust-v0.153.2" while the version itself is 0.153.2;
# the role builds the tag from this value. Checksums are upstream's own, from
# codex-package_SHA256SUMS, which covers only the "package" artifacts — the
# plain binary tarballs have no published checksum at all.
#
# As of 0.152.1 that file also lists codex-app-server-package-* artifacts,
# which match a grep for the bare target triple. Take the line whose filename
# starts with "codex-package-"; the app-server one is a different binary.
codex_version: 0.153.2
codex_sha256:
  x86_64-unknown-linux-musl: e10fa0cee78e9f0bd395880f03fd4fd227d903ca7af649bbc08d1649101e9225
  aarch64-unknown-linux-musl: a3bfaf4b62fcb17e0a0338dfe0502413ddce0ab1b39028679390539c45d2c6e3

# --- krr role ----------------------------------------------------------

# Robusta KRR. Upstream publishes no checksum file, so this sha256 was computed
# from the v1.29.0 artifact on 2026-08-17 and pins it from here on — same
# trust-on-first-use situation as kubie and cue. amd64 only; there is no arm64
# linux build.
krr_version: 1.29.0
krr_sha256: 0affa7b4ded83a23c8f561fe429595c4ec94f1ea7dc06f145504ce99b453c859

# --- hunk role ---------------------------------------------------------

# Built from source, not downloaded. This host's CPU (Xeon E5-2680 v2, Ivy
# Bridge) has AVX but no AVX2, and upstream's prebuilt linux-x64 binary dies
# with SIGILL on it. A local build embeds the baseline bun runtime instead.
# No checksum to pin — the artifact is produced here, from a git tag.
hunk_version: 0.21.0

# --- vault role -------------------------------------------------------

# HashiCorp publishes this checksum and signs the checksum file. Installing
# the release archive gives us only the CLI; the vendor apt package would also
# create a vault system user, server configuration and a systemd unit.
# Version current as of 2026-09-07.
vault_version: 2.1.0
vault_sha256:
  amd64: 08e8a13d29d20c5e28ef5e2c187bf3a2e84712a43615de1b3d24701ad9aab972
  arm64: 319b3eb7b0c2ad218453f5d1af5c23cac81a024db3a07ccd2494ecd31f2090c3

# --- herdr role --------------------------------------------------------

# Upstream publishes no checksum file, so these were computed from the v0.8.2
# artifacts on 2026-08-26 and pin them from here on.
#
# Note this role only swaps the binary; a running server keeps serving its old
# version until restarted. See "herdr" in the README.
# --- awscli role -------------------------------------------------------

# Debian 13 does ship awscli v2, but 2.23.6 against 2.36.36 upstream — about a
# year of AWS service coverage behind, which matters on a box driving EKS
# daily. Comes from AWS's installer instead, with its PGP signature verified
# against the key committed in roles/awscli/files/.
awscli_version: 2.36.36

herdr_version: 0.8.2
herdr_sha256:
  x86_64: 976150a14d490c94b243ea2e1a7eb2dfb67f12e36b182db90936f6728e6aecf4
  aarch64: f55610658e1c2e0d2aaef730b4b2ab885f7f8ba00285ab372bfb14f2e3d5b40d
