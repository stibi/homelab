---
# Inventory for the homelab.
#
# zase-prace is the Debian 13 work VM and is managed from itself, hence
# ansible_connection=local. Additional hosts go under the same group and
# will be reached over SSH.

all:
  children:
    workstations:
      hosts:
        zase-prace:
          ansible_connection: local
          ansible_host: localhost
