---
- name: Assert the host runs a Debian-family distribution
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
    fail_msg: >-
      These roles target Debian; this host reports
      {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}.
    quiet: true

- name: Install base packages
  become: true
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
